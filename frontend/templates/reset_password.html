<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="csrf-token" content="{{ csrf_token() }}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neyan AI — Reset Password</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='brand/neyan-mark.svg') }}">
<script>
(function () {
    try {
        var t = localStorage.getItem('neyanTheme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('neyanLang');
        if (l === 'ar') { document.documentElement.setAttribute('lang', 'ar'); document.documentElement.setAttribute('dir', 'rtl'); }
    } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
<style>
:root {
    --card-bg: rgba(16,26,43,.55); --card-border: rgba(255,255,255,.12);
    --input-bg: rgba(255,255,255,.045); --input-border: rgba(255,255,255,.12); --input-bg-focus: rgba(255,255,255,.07);
    --text: #FFFFFF; --text-soft: #B7BDC8; --text-faint: rgba(183,189,200,.62);
    --pill-bg: rgba(255,255,255,.05); --pill-border: rgba(255,255,255,.10); --pill-active-bg: rgba(22,140,255,.14);
}
[data-theme="light"] {
    --card-bg: rgba(255,255,255,.82); --card-border: rgba(16,26,43,.10);
    --input-bg: rgba(16,26,43,.03); --input-border: rgba(16,26,43,.14); --input-bg-focus: rgba(16,26,43,.05);
    --text: #10151F; --text-soft: #5B6472; --text-faint: rgba(91,100,114,.7);
    --pill-bg: rgba(16,26,43,.04); --pill-border: rgba(16,26,43,.10); --pill-active-bg: rgba(22,140,255,.12);
}
* { box-sizing: border-box; }
body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: 15px/1.5 'Inter', 'IBM Plex Sans Arabic', sans-serif; color: var(--text);
    background: radial-gradient(1200px 600px at 50% -10%, var(--bg-1), var(--bg-0));
    transition: background .2s ease, color .2s ease;
}
.topbar { position: fixed; top: 18px; inset-inline-end: 18px; display: flex; gap: 10px; }
.tp-pill { display: flex; align-items: center; background: var(--pill-bg); border: 1px solid var(--pill-border); border-radius: 999px; padding: 4px; }
.tp-pill button { appearance: none; border: none; background: transparent; color: var(--text-faint); font: 600 12px/1 'Inter', sans-serif; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.tp-pill button.active { color: var(--gold-light); background: var(--pill-active-bg); }
.card {
    width: min(420px, 92vw); background: var(--card-bg); border: 1.5px solid var(--card-border);
    border-radius: 18px; padding: 34px 30px; backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
}
.brand { display:flex; align-items:center; gap:10px; margin-bottom: 22px; color: var(--gold-light); font-weight:700; font-size: 15px; }
.brand img { width: 26px; height: 26px; flex-shrink: 0; }
h1 { font-size: 20px; margin: 0 0 6px; color: var(--text); }
p.sub { color: var(--text-soft); font-size: 13.5px; margin: 0 0 22px; }
label { display:block; font-size: 12.5px; font-weight:600; color: var(--text-soft); margin-bottom: 6px; }
.pwd-wrap { position: relative; }
.pwd-wrap input {
    width: 100%; height: 46px; padding-inline: 14px; padding-inline-end: 42px; border: 1.5px solid var(--input-border);
    border-radius: 11px; background: var(--input-bg); color: var(--text); font: 14px/1 inherit; outline: none;
}
.pwd-wrap input:focus { border-color: var(--gold); background: var(--input-bg-focus); }
.pwd-toggle {
    position: absolute; inset-inline-end: 4px; top: 50%; transform: translateY(-50%);
    border: none; background: transparent; color: var(--text-faint); width: 34px; height: 34px;
    border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.pwd-toggle:hover { color: var(--gold); background: var(--input-bg); }
.pwd-toggle svg { width: 15px; height: 15px; }
.tp-field { margin-bottom: 16px; }
button[type="submit"] {
    width: 100%; height: 46px; margin-top: 6px; border: none; border-radius: 11px; cursor: pointer;
    background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #10151F; font-weight: 700; font-size: 14px;
    position: relative;
}
button[type="submit"].is-loading { color: transparent; pointer-events: none; }
button[type="submit"].is-loading::after {
    content: ""; position: absolute; inset: 0; margin: auto; width: 17px; height: 17px; border-radius: 50%;
    border: 2px solid rgba(16,21,31,.35); border-top-color: #10151F; animation: rpSpin .7s linear infinite;
}
@keyframes rpSpin { to { transform: rotate(360deg); } }
.back { display:block; text-align:center; margin-top: 18px; color: var(--text-faint); text-decoration: none; font-size: 13px; }
.back:hover { color: var(--gold-light); }
.flash { padding: 11px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; }
.flash-success { background: rgba(52,199,89,.12); color: #6FE39A; border: 1px solid rgba(52,199,89,.3); }
.flash-error { background: rgba(255,69,58,.12); color: #FF8078; border: 1px solid rgba(255,69,58,.3); }
</style>
</head>
<body>

<div class="topbar">
    <div class="tp-pill" id="langPill" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="ar">AR</button>
    </div>
    <div class="tp-pill" id="themePill" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light">☀</button><button type="button" data-theme-choice="dark">☾</button>
    </div>
</div>

<div class="card">
    <div class="brand">
        <img src="{{ url_for('static', filename='brand/neyan-mark.svg') }}" alt="">
        <span>Neyan AI</span>
    </div>
    <h1 data-i18n="title">Choose a new password</h1>
    <p class="sub" data-i18n="sub">At least 8 characters, including a letter and a number.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="/reset-password/{{ token }}" id="rpForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="tp-field">
            <label data-i18n="labelNew">New Password</label>
            <div class="pwd-wrap">
                <input type="password" name="password" id="rpPwd1" placeholder="Min. 8 characters" minlength="8" required>
                <button type="button" class="pwd-toggle" onclick="rpToggle('rpPwd1', this)" aria-label="Show password" aria-pressed="false">
                    <svg viewBox="0 0 16 16" fill="none"><ellipse cx="8" cy="8" rx="6" ry="4" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/></svg>
                </button>
            </div>
        </div>
        <div class="tp-field">
            <label data-i18n="labelConfirm">Confirm New Password</label>
            <div class="pwd-wrap">
                <input type="password" name="confirm_password" id="rpPwd2" placeholder="Re-enter password" minlength="8" required>
                <button type="button" class="pwd-toggle" onclick="rpToggle('rpPwd2', this)" aria-label="Show password" aria-pressed="false">
                    <svg viewBox="0 0 16 16" fill="none"><ellipse cx="8" cy="8" rx="6" ry="4" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/></svg>
                </button>
            </div>
        </div>
        <button type="submit" data-i18n="submit">Reset Password</button>
    </form>

    <a class="back" href="/login" data-i18n="back">← Back to Sign In</a>
</div>

<svg style="position:absolute;width:0;height:0" aria-hidden="true">
    <defs>
        <linearGradient id="goldGradMini" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#55B6FF"/><stop offset="55%" stop-color="#168CFF"/><stop offset="100%" stop-color="#0B62B8"/>
        </linearGradient>
        <symbol id="neyanEmblemMini" viewBox="0 0 100 100">
            <path d="M50 4 L88 18 V50 C88 75 69 93 50 98 C31 93 12 75 12 50 V18 Z" fill="rgba(255,255,255,.02)" stroke="url(#goldGradMini)" stroke-width="3"/>
            <circle cx="50" cy="46" r="15" fill="#168CFF" fill-opacity=".14" stroke="url(#goldGradMini)" stroke-width="1.4"/>
            <path d="M40 42 Q42 39 46 40.6" stroke="#0B1220" stroke-width="1.8" fill="none" stroke-linecap="round"/>
            <path d="M60 42 Q58 39 54 40.6" stroke="#0B1220" stroke-width="1.8" fill="none" stroke-linecap="round"/>
            <ellipse cx="45" cy="44.5" rx="2.6" ry="2.1" fill="#0B1220"/>
            <ellipse cx="55" cy="44.5" rx="2.6" ry="2.1" fill="#0B1220"/>
            <path d="M46 52 L54 52 L50 56.5 Z" fill="#0B1220"/>
            <path d="M43 60 Q50 65 57 60" stroke="#0B1220" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </symbol>
    </defs>
</svg>

<script>
function rpToggle(id, btn) {
    var inp = document.getElementById(id);
    var show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.setAttribute('aria-pressed', show ? 'true' : 'false');
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    btn.querySelector('svg').innerHTML = show
        ? '<ellipse cx="8" cy="8" rx="6" ry="4" stroke="currentColor" stroke-width="1.4"/><line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>'
        : '<ellipse cx="8" cy="8" rx="6" ry="4" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/>';
}

var RP_I18N = {
    en: { title: "Choose a new password", sub: "At least 8 characters, including a letter and a number.",
          labelNew: "New Password", labelConfirm: "Confirm New Password", submit: "Reset Password", back: "← Back to Sign In" },
    ar: { title: "اختر كلمة مرور جديدة", sub: "8 أحرف على الأقل، تتضمن حرفاً ورقماً.",
          labelNew: "كلمة المرور الجديدة", labelConfirm: "تأكيد كلمة المرور", submit: "إعادة تعيين كلمة المرور", back: "→ العودة لتسجيل الدخول" }
};
function rpApplyLang(lang) {
    var dict = RP_I18N[lang] || RP_I18N.en;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (dict[key] !== undefined) el.textContent = dict[key];
    });
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    document.querySelectorAll('#langPill button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-lang') === lang); });
    try { localStorage.setItem('neyanLang', lang); } catch (e) {}
}
function rpApplyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('#themePill button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-theme-choice') === theme); });
    try { localStorage.setItem('neyanTheme', theme); } catch (e) {}
}
document.getElementById('langPill').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-lang]'); if (btn) rpApplyLang(btn.getAttribute('data-lang'));
});
document.getElementById('themePill').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-theme-choice]'); if (btn) rpApplyTheme(btn.getAttribute('data-theme-choice'));
});
(function () {
    var savedLang = 'en', savedTheme = 'dark';
    try { savedLang = localStorage.getItem('neyanLang') || 'en'; savedTheme = localStorage.getItem('neyanTheme') || 'dark'; } catch (e) {}
    rpApplyLang(savedLang);
    rpApplyTheme(savedTheme);
})();

var rpForm = document.getElementById('rpForm');
if (rpForm) {
    rpForm.addEventListener('submit', function () {
        var btn = rpForm.querySelector('button[type="submit"]');
        if (btn) { btn.classList.add('is-loading'); btn.disabled = true; }
    });
}
</script>
<script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</body>
</html>
